name = "sequence-game"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# OpenAI-compatible Meta Model API (docs: ai.developer.meta.com/docs/features/chat-completion)
MUSE_API_BASE = "https://api.meta.ai/v1"
MUSE_MODEL = "muse-spark-1.3"
ALLOWED_ORIGINS = "https://digitallifenotes.blog,https://www.digitallifenotes.blog"

# 30 Muse calls per minute per visitor IP
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Online rooms: one Durable Object per room (SQLite-backed, works on the free plan)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
