name = "sequence-game"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# AI model for the AI players: any OpenAI-compatible API. Now Google Gemini
# (docs: ai.google.dev/gemini-api/docs/openai). The key is a secret: LLM_API_KEY (or MUSE_API_KEY).
# For Meta Muse instead: LLM_API_BASE = "https://api.meta.ai/v1", LLM_MODEL = "muse-spark-1.3".
LLM_API_BASE = "https://generativelanguage.googleapis.com/v1beta/openai"
LLM_MODEL = "gemini-flash-lite-latest"
# Tried in order when a model is busy or rate-limited (free tier)
LLM_MODELS = "gemini-flash-lite-latest,gemini-flash-latest,gemini-2.5-flash-lite,gemini-2.5-flash"
# Thinking level: picking from 8 scored moves needs very little, and it keeps turns fast
LLM_REASONING = "minimal"
ALLOWED_ORIGINS = "https://digitallifenotes.blog,https://www.digitallifenotes.blog,lineup5://app"

# 30 Muse calls per minute per visitor IP
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Online rooms: one Durable Object per room (SQLite-backed, works on the free plan)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Daily challenge leaderboard (one object per day) and quick-match queue
[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Board"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board", "Matchmaker"]
